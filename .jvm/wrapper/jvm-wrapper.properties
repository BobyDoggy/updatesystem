# JVM Wrapper — configuration du runtime Java auto-provisionné pour le poste
# client (voir jvmw.cmd à la racine du projet). Même principe que le Maven
# Wrapper (.mvn/wrapper/maven-wrapper.properties) : ce fichier est versionné,
# le runtime téléchargé (.jvm/current/) ne l'est pas.
#
# Distribution : Eclipse Temurin (Adoptium), build JRE 21 Windows x64.
# Pour changer de version : régénérer ces deux valeurs depuis l'API Adoptium,
# par ex. :
#   https://api.adoptium.net/v3/assets/latest/21/hotspot?os=windows&architecture=x64&image_type=jre&vendor=eclipse
# (champ "package.link" pour l'URL, "package.checksum" pour le sha256),
# puis supprimer le dossier .jvm/current existant sur les postes déjà
# provisionnés pour forcer le re-téléchargement.

