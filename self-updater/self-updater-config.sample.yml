# Fichier d'exemple — copier vers "self-updater-config.yml" (dans le même
# dossier ou ailleurs) et adapter les valeurs à la machine cible. Le fichier
# copié est ignoré par git (voir .gitignore) car son contenu est spécifique
# à chaque poste.
#
# Utilisation :
#   java -jar self-updater.jar chemin/vers/self-updater-config.yml

self-updater:
  channel: stable

  source:
    type: http
    manifest-url: https://updates.exemple.com/manifest.json

  system-updater:
    jar-path: C:\Apps\updater\system-updater.jar
    version-file: C:\Apps\updater\system-updater-version.txt
    config-path: C:\Apps\updater\update-config.yml
    # Si le poste cible n'a pas de Java installé/dans le PATH, utiliser le
    # JVM Wrapper (jvmw.cmd à la racine du projet) pour lancer CE
    # self-updater.jar : il provisionne un JRE 21 local avant de démarrer.
    # Une fois provisionné, pointer ici directement vers le java.exe local
    # (ProcessBuilder n'exécute pas les scripts .cmd de façon fiable) :
    java-executable: C:\Apps\updater\.jvm\current\bin\java.exe
    # Sinon, si Java est déjà installé et dans le PATH sur ce poste :
    # java-executable: java
