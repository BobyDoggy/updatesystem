# Conf nginx servie par le conteneur nginx-updates (voir docker-compose.yml).
# root = /usr/share/nginx/html, mappé en lecture seule sur [rep_sftp_updates]
# de l'hôte (racine "files" du chroot SFTP de l'utilisateur ****).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # Seuls les fichiers connus sont servis
    location ~* \.(json|jar|zip)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Bloquer tout accès aux autres extensions
    location / {
        return 403;
    }
}
